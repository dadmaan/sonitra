pipeline:
  synth_backend: invalid_mode
  effects_chain: none
  sample_rate: 44100
  bit_depth: 24
  channels: 2
  duration_padding_sec: 2.0
  overwrite: false
  resume: true
  max_workers: 1
  log_level: INFO
  bpm: 120
io:
  corpus_root: .
  output_format: wav
  mp3_bitrate_kbps: 192
  file_naming: "{stem}"
dawdreamer:
  block_size: 512
  plugin_path: null
  preset_path: null
  faust_code: null
  clear_midi_between_renders: true
pedalboard:
  instrument:
    plugin_path: null
    preset_path: null
    reload_plugin_per_file: false
    silence_flush_sec: 0.5
  effects: []
