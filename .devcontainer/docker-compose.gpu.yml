# =============================================================================
# Sonitra — GPU override for devcontainer docker-compose.yml
#
# Requires NVIDIA drivers + NVIDIA Container Toolkit on the host.
# On Docker Desktop (Windows/Mac) GPU passthrough is built-in; no toolkit
# install is needed beyond the NVIDIA GPU driver.
#
# Activation (in devcontainer.json):
#   "dockerComposeFile": ["docker-compose.yml", "docker-compose.gpu.yml"]
#
# Then rebuild the container: Dev Containers -> Rebuild Container
# =============================================================================

services:
  sonitra:
    build:
      args:
        GPU_EXTRAS: gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
