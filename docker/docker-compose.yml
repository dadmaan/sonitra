# =============================================================================
# Sonitra — Docker Compose
#
# Run all commands from the repository root. A profile is always required —
# there is no profile-less default — so the CPU and GPU containers can never
# both start at once and collide on port 8000.
#
#   cp env.example .env                                              # first-time setup
#   echo "HOST_UID=$(id -u)" >> .env && echo "HOST_GID=$(id -g)" >> .env
#   docker compose -f docker/docker-compose.yml --profile cpu up --build
#   docker compose -f docker/docker-compose.yml --profile gpu up --build
#
# HOST_UID/HOST_GID: on native Linux hosts, bind mounts (below) share the
# host filesystem directly. Setting these to your own `id -u`/`id -g` makes
# the in-container `sonitra` user own the mounted files as your host user,
# so nothing needs to chown ./corpus, ./config, or ./output back and forth.
# Skippable on Docker Desktop (macOS/Windows), where bind mounts already go
# through a translation layer; defaults to 1000 if unset.
#
# Volume layout (relative to repo root):
#   ./corpus/   MIDI files (input) and rendered audio (intermediate output)
#   ./config/   Pipeline YAML configs — place your config.yaml here
#   ./output/   Transcriptions, evaluation results, benchmark outputs
#
# CLI one-off commands (name the service explicitly alongside --profile):
#   docker compose -f docker/docker-compose.yml --profile cpu run --rm sonitra \
#       uv run sonitra benchmark --corpus /app/corpus --workdir /app/output
#
# GPU passthrough requires the NVIDIA Container Toolkit on the host:
# https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/
# =============================================================================

x-sonitra-base: &sonitra-base
  volumes:
    - ../corpus:/app/corpus
    - ../config:/app/config
    - ../output:/app/output
  # Source environment variables from .env when present.
  # Copy env.example to .env and adjust values before first run.
  env_file:
    - path: ../.env
      required: false
  restart: unless-stopped
  healthcheck:
    test:
      - CMD
      - python3
      - -c
      - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
    interval: 30s
    timeout: 10s
    start_period: 60s
    retries: 3

services:

  sonitra:
    <<: *sonitra-base
    profiles: ["cpu"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    image: sonitra:latest
    ports:
      - "8000:8000"
    environment:
      # Path to the pipeline config YAML inside the container.
      # The entrypoint symlinks this to /app/config.yaml at startup.
      SONITRA_CONFIG: ${SONITRA_CONFIG:-/app/config/config.yaml}
      # Uvicorn log level (used when overriding CMD with uvicorn directly).
      LOG_LEVEL: ${LOG_LEVEL:-info}

  sonitra-gpu:
    <<: *sonitra-base
    profiles: ["gpu"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime-gpu      # NVIDIA CUDA base image; see Dockerfile Stage 3
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    image: sonitra:gpu
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      SONITRA_CONFIG: ${SONITRA_CONFIG:-/app/config/config.yaml}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
