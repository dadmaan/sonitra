pipeline:
  rendering_mode: dawdreamer_synth_pedalboard_fx
  sample_rate: 44100
  bit_depth: 24
  channels: 2
  duration_padding_sec: 2.0
  overwrite: false
  resume: true
  max_workers: 1
  log_level: INFO

io:
  midi_dir: ./corpus/midi
  output_dir: ./corpus/audio
  output_format: wav
  mp3_bitrate_kbps: 192
  file_naming: "{stem}"

dawdreamer:
  enabled: true
  block_size: 512
  plugin_path: null
  preset_path: null
  bpm: 120
  faust_code: null
  clear_midi_between_renders: true

pedalboard:
  enabled: true
  instrument:
    plugin_path: null
    preset_path: null
    reload_plugin_per_file: false
    silence_flush_sec: 0.5
  effects:
    - type: Compressor
      threshold_db: -18.0
      ratio: 4.0
      attack_ms: 5.0
      release_ms: 100.0
      enabled: true
    - type: Reverb
      room_size: 0.4
      damping: 0.5
      wet_level: 0.15
      dry_level: 0.85
      width: 1.0
      freeze_mode: false
      enabled: true

normalisation:
  enabled: false
  mode: peak
  target_db: -1.0
  pre_effects: false

quality_gates:
  silence_threshold_rms: 0.001
  min_duration_sec: 0.1
  max_duration_deviation_sec: 1.0
  clip_threshold: 1.0

observability:
  write_manifest: false
  manifest_path: ./renders.jsonl
  write_failed_list: false
  emit_sse_events: false

# Optional stem separation between rendering and transcription.
separation:
  enabled: false
  backend: passthrough   # passthrough or demucs (requires `pip install sonitra[demucs]`)
  model: htdemucs
  device: cpu
  stem: null             # stem to transcribe (e.g. "other"); null = first available
  output_dir: stems

# AMT systems to benchmark. Types: basic_pitch, external_command, precomputed.
transcription:
  output_dir: transcriptions
  transcribers:
    - type: basic_pitch
      enabled: true
      onset_threshold: 0.5
      frame_threshold: 0.3
    # Black-box commercial tools: export their MIDI into a directory.
    # - type: precomputed
    #   name: klangio
    #   midi_dir: ./external/klangio
    # Any CLI tool that reads audio and writes MIDI.
    # - type: external_command
    #   name: my-amt-tool
    #   command: "amt-tool transcribe {input} -o {output}"

# Metric suite (research-standard tolerances by default).
evaluation:
  note_metrics:
    enabled: true
    onset_tolerance_sec: 0.05
    offset_ratio: 0.2
    offset_min_tolerance_sec: 0.05
    velocity_tolerance: 0.1
  frame_metrics:
    enabled: true
    hop_sec: 0.01
  expressive_metrics:
    enabled: true
    harmony_window_sec: 2.0
  dtw:
    enabled: false
    frame_size: 4096
    hop_size: 2048
    max_frames: 4000

# Experimental conditions for `sonitra benchmark`. Each sweep value becomes a
# condition; metrics are reported per condition with deltas vs the baseline.
benchmark:
  results_path: benchmark_results.jsonl
  include_baseline: true
  baseline_name: baseline
  conditions: []
  sweeps:
    - name: reverb_wet
      parameter: pedalboard.effects.1.wet_level
      values: [0.0, 0.3, 0.6]
