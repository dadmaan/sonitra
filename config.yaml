# Default Sonitra config — works out of the box.
# Basic Pitch is installed by default; install sonitra[demucs] to use Demucs.
pipeline:
  rendering_mode: dawdreamer_synth_pedalboard_fx
  sample_rate: 44100
  bit_depth: 24
  channels: 2
  duration_padding_sec: 2.0
  overwrite: false
  resume: true
  max_workers: 1
  log_level: INFO

io:
  midi_dir: ./corpus/midi
  output_dir: ./corpus/audio
  output_format: wav
  mp3_bitrate_kbps: 192
  file_naming: "{stem}"

dawdreamer:
  enabled: true
  block_size: 512
  plugin_path: null
  preset_path: null
  # Example: render with the Vital VST3 instrument and a .vital preset.
  # Sonitra transparently wraps Vital's native .vital JSON into a VST3
  # .vstpreset container so that DawDreamer can load it.
  # plugin_path: /workspace/plugin/vital/lib/vst3/Vital.vst3
  # preset_path: /workspace/preset/vital/Keys - Goodies.vital
  soundfont_path: /usr/share/sounds/sf2/default-GM.sf2
  bpm: 120
  faust_code: null
  clear_midi_between_renders: true

pedalboard:
  enabled: true
  instrument:
    plugin_path: null
    preset_path: null
    reload_plugin_per_file: false
    silence_flush_sec: 0.5
  effects:
    - type: Compressor
      threshold_db: -18.0
      ratio: 4.0
      attack_ms: 5.0
      release_ms: 100.0
      enabled: true
    - type: Reverb
      room_size: 0.4
      damping: 0.5
      wet_level: 0.15
      dry_level: 0.85
      width: 1.0
      freeze_mode: false
      enabled: true
    # Optional: add a Limiter here for pre-normalisation dynamics control. It is
    # NOT required to prevent clipping — post-effects peak normalisation below
    # already guarantees the output peak is < clip_threshold. If you add it,
    # note that it shifts later effect indices and would move the reverb_wet
    # sweep target.
    # - type: Limiter
    #   threshold_db: -1.0
    #   release_ms: 100.0
    #   enabled: true

# Post-effects peak normalisation is the clipping fix. In peak mode the signal is
# scaled so its peak == 10^(target_db/20) ≈ 0.891, then clipped to [-1, 1], which
# is guaranteed below clip_threshold: 1.0. pre_effects: false runs it AFTER the
# effects chain.
normalisation:
  enabled: true
  mode: peak
  target_db: -1.0
  pre_effects: false

quality_gates:
  silence_threshold_rms: 0.001
  min_duration_sec: 0.1
  max_duration_deviation_sec: 1.0
  clip_threshold: 1.0

# Observability is disabled by default to avoid writing files in the working
# directory. Inspect PipelineResult.log / quality_flags programmatically, or
# enable these flags explicitly when running batch workflows.
observability:
  write_manifest: false
  manifest_path: ./renders.jsonl
  write_failed_list: false
  emit_sse_events: false

separation:
  enabled: false
  backend: passthrough   # set to "demucs" only after `pip install sonitra[demucs]`
  model: htdemucs
  device: cpu
  stem: null
  output_dir: stems

# Default AMT backend: Basic Pitch (installed by default).
transcription:
  output_dir: transcriptions
  transcribers:
    - type: basic_pitch
      enabled: true
      onset_threshold: 0.5
      frame_threshold: 0.3
      minimum_note_length_ms: 127.7
      minimum_frequency_hz: null
      maximum_frequency_hz: null
    # Black-box commercial tools: export their MIDI into a directory.
    # - type: precomputed
    #   name: klangio
    #   midi_dir: ./external/klangio
    # Any CLI tool that reads audio and writes MIDI.
    # - type: external_command
    #   name: my-amt-tool
    #   command: "amt-tool transcribe {input} -o {output}"

evaluation:
  note_metrics:
    enabled: true
    onset_tolerance_sec: 0.05
    offset_ratio: 0.2
    offset_min_tolerance_sec: 0.05
    velocity_tolerance: 0.1
  frame_metrics:
    enabled: true
    hop_sec: 0.01
  expressive_metrics:
    enabled: true
    harmony_window_sec: 2.0
  dtw:
    enabled: false
    frame_size: 4096
    hop_size: 2048
    max_frames: 4000

benchmark:
  results_path: benchmark_results.jsonl
  include_baseline: true
  baseline_name: baseline
  conditions: []
  sweeps:
    - name: reverb_wet
      parameter: pedalboard.effects.1.wet_level
      values: [0.0, 0.3, 0.6]
