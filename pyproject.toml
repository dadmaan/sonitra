[project]
name = "sonitra"
version = "0.2.0"
description = "Automatic music transcription (AMT) benchmark."
authors = [
    {name = "Shayan Dadman", email = "dadman.shayan@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dawdreamer",
    "mido",
    "numpy",
    "scipy",
    "pedalboard",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "typer",
    "pyyaml",
    "pydantic",
    "basic-pitch>=0.4.0,<0.5.0",
]

[project.optional-dependencies]
basicpitch = [
    "basic-pitch>=0.4.0,<0.5.0",
]
demucs = [
    "demucs",
]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    "pytest-anyio",
    "anyio",
]
gpu = [
    "tensorflow[and-cuda]==2.15.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.scripts]
sonitra = "sonitra.cli:app"

[tool.pytest.ini_options]
markers = [
    "skip_if_no_vst: requires a real VST plugin path",
    "integration: end-to-end tests requiring a VST",
    "slow: tests that invoke optional/heavy backends such as basic-pitch",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "sonitra", from = "src"}]
