[project]
name = "sonitra"
version = "0.3.0"
description = "Automatic music transcription (AMT) benchmark."
authors = [
    {name = "Shayan Dadman", email = "dadman.shayan@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dawdreamer",
    "mido",
    "numpy",
    "scipy",
    "pedalboard",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "typer",
    "pyyaml",
    "pydantic",
    "rich",
    "basic-pitch>=0.4.0,<0.5.0",
]

[project.optional-dependencies]
basicpitch = [
    "basic-pitch>=0.4.0,<0.5.0",
]
demucs = [
    "demucs",
]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    "pytest-anyio",
    "anyio",
]
gpu = [
    # For bare-metal (non-Docker) installs only. docker/Dockerfile's GPU
    # image (target `runtime-gpu`) no longer uses this extra — it installs
    # CUDA/cuDNN system-wide via apt on an nvidia/cuda base image instead,
    # after this pip-wheel approach hit a reproducible TensorFlow 2.15 GPU
    # registration bug (see the Dockerfile's Stage 3 comment). Left here for
    # bare-metal installs where the pip-wheel approach may still be fine.
    #
    # Install nvidia-* CUDA runtime wheels directly instead of
    # tensorflow[and-cuda]==2.15.0 because that extra transitively depends on
    # tensorrt-libs==8.6.1 which is NOT on public PyPI (NVIDIA private index
    # only).  These 11 wheels are pinned to the exact versions that TF 2.15
    # declares as its and-cuda extras and are equivalent for GPU inference.
    "nvidia-cublas-cu12==12.2.5.6 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cuda-cupti-cu12==12.2.142 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cuda-nvcc-cu12==12.2.140 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cuda-nvrtc-cu12==12.2.140 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cuda-runtime-cu12==12.2.140 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cudnn-cu12==8.9.4.25 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cufft-cu12==11.0.8.103 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-curand-cu12==10.3.3.141 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cusolver-cu12==11.5.2.141 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cusparse-cu12==12.1.2.141 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-nccl-cu12==2.16.5 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-nvjitlink-cu12==12.2.140 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.scripts]
sonitra = "sonitra.cli:app"

[tool.pytest.ini_options]
markers = [
    "skip_if_no_vst: requires a real VST plugin path",
    "integration: end-to-end tests requiring a VST",
    "slow: tests that invoke optional/heavy backends such as basic-pitch",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "sonitra", from = "src"}]
