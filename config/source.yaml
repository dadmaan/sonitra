# Sonitra — source configuration
#
# This file documents every available parameter with brief commentary.
# Copy it as your starting point, strip sections you don't need, and
# adjust paths to match your environment.
#
# Tip: run `sonitra init --config config.yaml` to generate a minimal
# starter config without the commentary.

render_pipeline:
    synth_backend: dawdreamer_faust
    # dawdreamer_faust         — DawDreamer synth using Faust oscillator, no VST
    # dawdreamer_vst           — DawDreamer synth using a VST3 plugin
    # fluidsynth               — SoundFont-based synthesis via fluidsynth CLI
    # pedalboard_instrument    — Pedalboard instrument plugin
    effects_chain: pedalboard
    # none                     — no effects chain applied after synthesis
    # pedalboard               — apply Pedalboard effects chain after synthesis
    input_type: midi
    # midi                     — render from symbolic MIDI via synth_backend (default)
    # audio                    — read source audio directly, synth is skipped;
    #                            fluidsynth.soundfont_path / dawdreamer.plugin_path
    #                            are not required in this mode; source recordings
    #                            live in {corpus_root}/{dataset}/recordings/ (sibling
    #                            of midi/), paired to a reference MIDI by filename
    #                            token prefix; audio-level DTW (evaluation.dtw) is
    #                            automatically skipped in this mode — see below
    bpm: 120 # host tempo for tempo-synced plugins and FluidSynth's tick grid (notes follow the MIDI file's own tempo map; bpm never moves notes)
    sample_rate: 44100 # Hz; 44100 or 48000 recommended
    bit_depth: 24 # 16 or 24
    channels: 2 # 1 = mono, 2 = stereo
    duration_padding_sec: 2.0 # silence appended after last note-off to capture reverb tail
    overwrite: false # re-render files that already exist in output_dir
    resume: true # skip files already present in output_dir (complement of overwrite)
    max_workers: 1 # DawDreamer backends require 1; pedalboard_instrument supports > 1
    log_level: INFO # DEBUG | INFO | WARNING | ERROR

io:
    corpus_root: ./corpus # root directory for all corpus data; midi at {corpus_root}/{dataset}/midi/, audio at {corpus_root}/{dataset}/audio/{config}/, source recordings (input_type: audio) at {corpus_root}/{dataset}/recordings/
    output_format: wav # wav | flac | mp3
    mp3_bitrate_kbps: 192 # only applies when output_format: mp3
    file_naming: "{stem}" # output filename template; {stem} = MIDI filename without extension
    dataset: null # optional: scope paths to {corpus_root}/{dataset}/midi|audio|transcription|eval_results/
    # File selection: restrict a run to a subset of the dataset's reference files.
    # Leave `where` empty and `sample` null to use every file. `sonitra serve` loads
    # this file and ignores selection, so these values stay at their defaults here.
    #
    #   metadata_csv bare filename resolved under {corpus_root}/{dataset}/metadata/.
    #                Pass a filename, not a repo-relative path (unlike the exporter
    #                scripts, which take repo-relative paths): a relative path here
    #                resolves below the metadata directory and is reported as missing.
    #                Required with `where`, rejected without it.
    #   join_column  metadata column matched against the reference file stem
    #                (default midi_filename; GAPS uses midi_path). Ignored without `where`.
    #   where        exact-match filter, which requires `dataset` and `metadata_csv`:
    #                a file is kept when every column matches (AND) and its value
    #                matches any entry of that column's list (OR). Values compare as
    #                strings; ints are accepted and stringified. Lists are sorted and
    #                de-duplicated, so their order never matters.
    #   sample       draw n files deterministically from the filtered set with seed
    #                (default 0); n must be at least 1, and n >= set size keeps all
    #                files. The CLI --limit and --seed flags write into these fields.
    #
    # Example: MAESTRO-v3 official test split.
    #   dataset: maestro-v3
    #   metadata_csv: maestro-v3.0.0.csv
    #   join_column: midi_filename
    #   where:
    #       split: [test]
    #   sample:
    #       n: 177
    #       seed: 0
    metadata_csv: null
    join_column: midi_filename
    where: {}
    sample: null

dawdreamer:
    block_size: 512
    # VST3 instrument plugin (e.g. Vital).
    # Download Vital from https://vital.audio/ and place it under plugin/ (gitignored).
    # Linux path after extraction: plugin/vital/lib/vst3/Vital.vst3
    # Required when synth_backend: dawdreamer_vst; must be null for dawdreamer_faust.
    plugin_path: null
    # Preset file for the VST3 plugin.
    # Place .vital preset files under preset/ (gitignored).
    # Example: preset/vital/Keys - Goodies.vital
    preset_path: null
    faust_code: null # inline Faust DSP code; overrides plugin_path when set
    clear_midi_between_renders: true # reset MIDI state between files to prevent note bleed

fluidsynth:
    # SoundFont for FluidSynth-based synthesis.
    # Required when synth_backend: fluidsynth.
    # Install on Linux: sudo apt install fluid-soundfont-gm
    soundfont_path: null # e.g. /usr/share/sounds/sf2/default-GM.sf2
    program: null # GM program 0-127 forced on every FluidSynth render (e.g. 24 = Acoustic Guitar (nylon), relevant for GuitarSet MIDI input).
        # null (default) inherits the source MIDI's program when unambiguous (zero or one distinct program_change in the file);
        # a number overrides the file; multi-timbral files (two or more distinct programs) fall back to the SoundFont's own
        # preset with a warning — set this to choose one explicitly.

pedalboard:
    instrument:
        plugin_path: null # VST3/AU instrument for pedalboard_instrument backend
        preset_path: null
        reload_plugin_per_file: false # reload plugin state per file; safer but slower
        silence_flush_sec: 0.5 # seconds of silence used to flush the plugin buffer
    effects:
        # Effects are applied in declaration order.
        # Set enabled: false to bypass an effect without removing it from the chain.
        # Indices matter for benchmark sweeps (e.g. pedalboard.effects.1.wet_level).
        # HighpassFilter/LowpassFilter are first-order (6 dB/octave). Cascading two
        # instances at the same cutoff_frequency_hz is the documented way to get a
        # steeper slope; the cascade's -3 dB point then moves to 0.644*f_c (lowpass)
        # / 1.554*f_c (highpass) relative to the per-stage nominal cutoff. See
        # config/benchmark/old_recording/README.md (Section 5) for a worked example
        # with measured numbers.
        - type: Compressor
          threshold_db: -18.0
          ratio: 4.0
          attack_ms: 5.0
          release_ms: 100.0
          enabled: true
        - type: Reverb # index 1 — referenced by the default reverb_wet sweep
          room_size: 0.4
          damping: 0.5
          wet_level: 0.15
          dry_level: 0.85
          width: 1.0
          freeze_mode: false
          enabled: true
        # Additional effect types (uncomment and adjust as needed):
        # - type: Limiter
        #   threshold_db: -1.0
        #   release_ms: 100.0
        #   enabled: false
        # - type: Chorus
        #   rate_hz: 1.0
        #   depth: 0.1
        #   centre_delay_ms: 7.0
        #   feedback: 0.0
        #   mix: 0.5
        #   enabled: false
        # - type: Delay
        #   delay_seconds: 0.5
        #   feedback: 0.0
        #   mix: 0.5
        #   enabled: false
        # - type: Distortion
        #   drive_db: 10.0
        #   enabled: false
        # - type: Gain
        #   gain_db: 0.0
        #   enabled: false
        # - type: VST3Plugin
        #   plugin_path: plugin/my_effect.vst3
        #   enabled: false
        # - type: HighpassFilter
        #   cutoff_frequency_hz: 100.0  # first-order, 6dB/octave roll-off below this
        #   enabled: false
        # - type: LowpassFilter
        #   cutoff_frequency_hz: 8000.0  # first-order, 6dB/octave roll-off above this
        #   enabled: false
        # - type: HighShelfFilter
        #   cutoff_frequency_hz: 5000.0
        #   gain_db: -6.0  # negative = cut, positive = boost, above cutoff
        #   q: 0.7
        #   enabled: false
        # - type: LowShelfFilter
        #   cutoff_frequency_hz: 100.0
        #   gain_db: 3.0  # negative = cut, positive = boost, below cutoff
        #   q: 0.7
        #   enabled: false
        # - type: PeakFilter
        #   cutoff_frequency_hz: 2500.0
        #   gain_db: 3.0  # boost/cut centred on cutoff_frequency_hz
        #   q: 1.0
        #   enabled: false
        # - type: TuningOffset
        #   cents: 0.0  # required; whole-signal shift in hundredths of a semitone, negative = down
        #   high_quality: true  # slower, more accurate stretcher
        #   transient_mode: crisp  # crisp | mixed | smooth
        #   transient_detector: compound  # compound | percussive | soft
        #   retain_phase_continuity: true  # keep phase continuous across FFT frames
        #   use_long_fft_window: null  # null = let the stretcher pick the window length
        #   use_time_domain_smoothing: false  # smoother onsets, more smearing
        #   preserve_formants: true  # keep vocal formants while shifting
        #   enabled: false  # bypassed by default
        # The shift runs through Rubber Band's offline pitch/time stretcher behind
        # pedalboard.time_stretch, because the PitchShift plugin drops sub-semitone
        # shifts. cents: 0.0 never reaches the stretcher, so an enabled zero-cent slot
        # stays a passthrough; a +c / -c pair round-trips through it to show its artifacts.

# Post-effects peak normalisation ensures the rendered audio stays below the clip
# threshold. In peak mode the signal is scaled so its peak == 10^(target_db/20).
normalisation:
    enabled: true
    mode: peak # peak | rms
    target_db: -1.0 # target level in dBFS
    pre_effects: false # true = normalise before effects chain; false = after

quality_gates:
    silence_threshold_rms: 0.001 # files with RMS below this are flagged as silent
    min_duration_sec: 0.1 # files shorter than this are rejected
    max_duration_deviation_sec: 1.0 # allowed deviation from the expected MIDI duration
    clip_threshold: 1.0 # peak above this is flagged as clipped

observability:
    write_manifest: false # write per-file outcomes to a JSONL manifest
    manifest_path: ./renders.jsonl
    write_failed_list: false # append failed filenames to renders.failed.txt
    emit_sse_events: false # push status events to connected API clients
    log_level: null # optional root log level override; DEBUG | INFO | WARNING | ERROR | CRITICAL; overrides pipeline.log_level when set
    progress: true # master switch for live progress bars in the CLI

# Stem separation — planned feature, not yet implemented.
# See ROADMAP.md for the intended design.
# Leave enabled: false; the passthrough backend is a no-op.
separation:
    enabled: false
    backend: passthrough # only "passthrough" is implemented; "demucs" is planned
    model: htdemucs
    device: cpu # unified: "cpu", "cuda", "cuda:N" or "GPU:N"; "GPU:0" → torch "cuda:0" (see transcribe/devices.py)
    stem: null
    output_dir: stems

transcription:
    output_dir: transcriptions
    max_workers: 1 # parallel audio files per transcriber; safe for any rendering mode
    numeric_mode: "off" # framework determinism + precision: off | warn (fallback) | strict (raise); strict recommended for published runs
    gpu_memory_growth: false # TF allocates GPU memory as needed; may change cuDNN algorithm choice, so it stays in the benchmark fingerprint
    transcribers:
        - type: basic_pitch # Spotify Basic Pitch — installed by default
          enabled: true
          onset_threshold: 0.5 # frame activation threshold for note onset detection
          frame_threshold: 0.3 # frame activation threshold for note frame detection
          minimum_note_length_ms: 127.7
          minimum_frequency_hz: null # null = no lower frequency cutoff
          maximum_frequency_hz: null # null = no upper frequency cutoff
          device: cpu # unified: "cpu", "cuda", "cuda:N" or "GPU:N"; "cuda" → TF "GPU:0" (see transcribe/devices.py)
          melodia_trick: true # HMM/melodia post-processing smoothing (code default)
          multiple_pitch_bends: false # allow overlapping same-pitch notes w/ glissando (code default)
          save_raw_outputs: false # persist raw model outputs as CSV sidecar next to each MIDI (code default)
          batch_size: 16 # stacked-window inference batch size, CPU only (GPU stays at 1: batched-GPU throughput is unmeasured); 16-32 recommended
        # Pre-exported MIDI from any external tool:
        # - type: precomputed
        #   name: klangio             # used as the output subdirectory name
        #   midi_dir: ./external/klangio
        # Any CLI tool that reads audio and writes MIDI:
        # - type: external_command
        #   name: my-amt-tool
        #   command: "amt-tool transcribe {input} -o {output}"
        # TransKun — requires `pip install sonitra[transkun]`:
        # - type: transkun
        #   device: cpu               # unified: cpu, cuda, cuda:N, GPU:N (plus mps); GPU:0 → cuda:0
        #   segment_size_sec: null    # null lets bundled conf stay default (16s)
        #   segment_hop_sec: null     # null lets bundled conf stay default (8s)
        #   weights_path: null        # null uses bundled checkpoint
        #   conf_path: null           # null uses bundled conf

evaluation:
    max_workers: 1 # parallel reference/estimate pairs during scoring
    note_metrics:
        enabled: true
        onset_tolerance_sec: 0.05 # ±50 ms onset matching window
        offset_ratio: 0.2 # offset tolerance as a fraction of note duration
        offset_min_tolerance_sec: 0.05 # minimum offset tolerance regardless of duration
        velocity_tolerance: 0.1 # velocity tolerance as a fraction of the 0–127 range
    frame_metrics:
        enabled: true
        hop_sec: 0.01 # piano-roll frame resolution (10 ms)
    expressive_metrics:
        enabled: true
        harmony_window_sec: 2.0 # sliding window size for pitch-class harmony similarity
    dtw:
        enabled: false # audio-level DTW requires re-synthesis of the transcription;
        # automatically skipped when pipeline.input_type: audio, regardless of this
        # setting — comparing re-synthesised transcription audio against a real
        # recording is not meaningful, so leave this false in audio-mode configs
        frame_size: 4096
        hop_size: 2048
        max_frames: 4000 # truncate comparison to this many frames (memory guard)

benchmark:
    results_path: benchmark_results.jsonl
    include_baseline: true
    baseline_name: baseline # condition name used as the reference for delta metrics
    max_workers: 1 # parallel conditions; uses ProcessPoolExecutor for JUCE isolation
    save_audio: true # keep rendered audio/stems on disk after a condition finishes; set false to delete them once transcribed+evaluated, bounding disk usage for large sweeps
    resume: false # continue a stopped run: skip (condition, file, transcriber) triples already present in results_path instead of recomputing them
    # Full run directory (renamed or moved by hand: used exactly as given, no config stem is appended).
    # Precedence: --workdir, then this key, then <io.corpus_root>/<io.dataset>/benchmark/<config stem>
    # when io.dataset is set, otherwise ./benchmark/<config stem>.
    # With resume: false, starting a run deletes existing results in this folder, so two configs (or one
    # config run with different --dataset values) sharing a fixed folder overwrite each other. The CLI
    # refuses --dataset when it differs from io.dataset while this key is set, unless --workdir is given.
    # Not part of the resume fingerprint, so the folder can be moved and resumed from its new path.
    benchmark_dir: null
    conditions: [] # named config variants; each provides a list of overrides
    sweeps:
        - name: reverb_wet # sweep name used in results output
          parameter: pedalboard.effects.1.wet_level # dotted path into the config tree
          values: [0.0, 0.3, 0.6]
