# Sonitra — source configuration
#
# This file documents every available parameter with brief commentary.
# Copy it as your starting point, strip sections you don't need, and
# adjust paths to match your environment.
#
# Tip: run `sonitra init --config config.yaml` to generate a minimal
# starter config without the commentary.

pipeline:
  synth_backend: dawdreamer_faust
  # dawdreamer_faust         — DawDreamer synth using Faust oscillator, no VST
  # dawdreamer_vst           — DawDreamer synth using a VST3 plugin
  # fluidsynth               — SoundFont-based synthesis via fluidsynth CLI
  # pedalboard_instrument    — Pedalboard instrument plugin
  effects_chain: pedalboard
  # none                     — no effects chain applied after synthesis
  # pedalboard               — apply Pedalboard effects chain after synthesis
  bpm: 120                   # playback tempo during rendering
  sample_rate: 44100       # Hz; 44100 or 48000 recommended
  bit_depth: 24            # 16 or 24
  channels: 2              # 1 = mono, 2 = stereo
  duration_padding_sec: 2.0  # silence appended after last note-off to capture reverb tail
  overwrite: false         # re-render files that already exist in output_dir
  resume: true             # skip files already present in output_dir (complement of overwrite)
  max_workers: 1           # DawDreamer backends require 1; pedalboard_instrument supports > 1
  log_level: INFO          # DEBUG | INFO | WARNING | ERROR

io:
  corpus_root: ./corpus  # root directory for all corpus data; midi at {corpus_root}/{dataset}/midi/, audio at {corpus_root}/{dataset}/audio/{config}/
  output_format: wav         # wav | flac | mp3
  mp3_bitrate_kbps: 192      # only applies when output_format: mp3
  file_naming: "{stem}"      # output filename template; {stem} = MIDI filename without extension
  dataset: null              # optional: scope paths to {corpus_root}/{dataset}/midi|audio|transcription|eval_results/

dawdreamer:
  block_size: 512
  # VST3 instrument plugin (e.g. Vital).
  # Download Vital from https://vital.audio/ and place it under plugin/ (gitignored).
  # Linux path after extraction: plugin/vital/lib/vst3/Vital.vst3
  # Required when synth_backend: dawdreamer_vst; must be null for dawdreamer_faust.
  plugin_path: null
  # Preset file for the VST3 plugin.
  # Place .vital preset files under preset/ (gitignored).
  # Example: preset/vital/Keys - Goodies.vital
  preset_path: null
  faust_code: null           # inline Faust DSP code; overrides plugin_path when set
  clear_midi_between_renders: true  # reset MIDI state between files to prevent note bleed

fluidsynth:
  # SoundFont for FluidSynth-based synthesis.
  # Required when synth_backend: fluidsynth.
  # Install on Linux: sudo apt install fluid-soundfont-gm
  soundfont_path: null       # e.g. /usr/share/sounds/sf2/default-GM.sf2

pedalboard:
  instrument:
    plugin_path: null              # VST3/AU instrument for pedalboard_instrument backend
    preset_path: null
    reload_plugin_per_file: false  # reload plugin state per file; safer but slower
    silence_flush_sec: 0.5         # seconds of silence used to flush the plugin buffer
  effects:
    # Effects are applied in declaration order.
    # Set enabled: false to bypass an effect without removing it from the chain.
    # Indices matter for benchmark sweeps (e.g. pedalboard.effects.1.wet_level).
    - type: Compressor
      threshold_db: -18.0
      ratio: 4.0
      attack_ms: 5.0
      release_ms: 100.0
      enabled: true
    - type: Reverb               # index 1 — referenced by the default reverb_wet sweep
      room_size: 0.4
      damping: 0.5
      wet_level: 0.15
      dry_level: 0.85
      width: 1.0
      freeze_mode: false
      enabled: true
    # Additional effect types (uncomment and adjust as needed):
    # - type: Limiter
    #   threshold_db: -1.0
    #   release_ms: 100.0
    #   enabled: false
    # - type: Chorus
    #   rate_hz: 1.0
    #   depth: 0.1
    #   centre_delay_ms: 7.0
    #   feedback: 0.0
    #   mix: 0.5
    #   enabled: false
    # - type: Delay
    #   delay_seconds: 0.5
    #   feedback: 0.0
    #   mix: 0.5
    #   enabled: false
    # - type: Distortion
    #   drive_db: 10.0
    #   enabled: false
    # - type: Gain
    #   gain_db: 0.0
    #   enabled: false
    # - type: VST3Plugin
    #   plugin_path: plugin/my_effect.vst3
    #   enabled: false

# Post-effects peak normalisation ensures the rendered audio stays below the clip
# threshold. In peak mode the signal is scaled so its peak == 10^(target_db/20).
normalisation:
  enabled: true
  mode: peak               # peak | rms
  target_db: -1.0          # target level in dBFS
  pre_effects: false       # true = normalise before effects chain; false = after

quality_gates:
  silence_threshold_rms: 0.001     # files with RMS below this are flagged as silent
  min_duration_sec: 0.1            # files shorter than this are rejected
  max_duration_deviation_sec: 1.0  # allowed deviation from the expected MIDI duration
  clip_threshold: 1.0              # peak above this is flagged as clipped

observability:
  write_manifest: false         # write per-file outcomes to a JSONL manifest
  manifest_path: ./renders.jsonl
  write_failed_list: false      # append failed filenames to renders.failed.txt
  emit_sse_events: false        # push status events to connected API clients

# Stem separation — planned feature, not yet implemented.
# See ROADMAP.md for the intended design.
# Leave enabled: false; the passthrough backend is a no-op.
separation:
  enabled: false
  backend: passthrough   # only "passthrough" is implemented; "demucs" is planned
  model: htdemucs
  device: cpu
  stem: null
  output_dir: stems

transcription:
  output_dir: transcriptions
  max_workers: 1                 # parallel audio files per transcriber; safe for any rendering mode
  transcribers:
    - type: basic_pitch          # Spotify Basic Pitch — installed by default
      enabled: true
      onset_threshold: 0.5       # frame activation threshold for note onset detection
      frame_threshold: 0.3       # frame activation threshold for note frame detection
      minimum_note_length_ms: 127.7
      minimum_frequency_hz: null # null = no lower frequency cutoff
      maximum_frequency_hz: null # null = no upper frequency cutoff
      device: cpu                # TF device for inference: "cpu", "GPU:0", "GPU:1", …
    # Pre-exported MIDI from any external tool:
    # - type: precomputed
    #   name: klangio             # used as the output subdirectory name
    #   midi_dir: ./external/klangio
    # Any CLI tool that reads audio and writes MIDI:
    # - type: external_command
    #   name: my-amt-tool
    #   command: "amt-tool transcribe {input} -o {output}"

evaluation:
  max_workers: 1                 # parallel reference/estimate pairs during scoring
  note_metrics:
    enabled: true
    onset_tolerance_sec: 0.05        # ±50 ms onset matching window
    offset_ratio: 0.2                # offset tolerance as a fraction of note duration
    offset_min_tolerance_sec: 0.05   # minimum offset tolerance regardless of duration
    velocity_tolerance: 0.1          # velocity tolerance as a fraction of the 0–127 range
  frame_metrics:
    enabled: true
    hop_sec: 0.01                    # piano-roll frame resolution (10 ms)
  expressive_metrics:
    enabled: true
    harmony_window_sec: 2.0          # sliding window size for pitch-class harmony similarity
  dtw:
    enabled: false                   # audio-level DTW requires re-synthesis of the transcription
    frame_size: 4096
    hop_size: 2048
    max_frames: 4000                 # truncate comparison to this many frames (memory guard)

benchmark:
  results_path: benchmark_results.jsonl
  include_baseline: true
  baseline_name: baseline            # condition name used as the reference for delta metrics
  max_workers: 1                     # parallel conditions; uses ProcessPoolExecutor for JUCE isolation
  conditions: []                     # named config variants; each provides a list of overrides
  sweeps:
    - name: reverb_wet               # sweep name used in results output
      parameter: pedalboard.effects.1.wet_level  # dotted path into the config tree
      values: [0.0, 0.3, 0.6]
