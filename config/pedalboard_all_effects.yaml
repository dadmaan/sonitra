# Pedalboard: exercise every built-in effect type in one chain.
pipeline:
  rendering_mode: dawdreamer_synth_pedalboard_fx
  sample_rate: 44100
  bit_depth: 24
  channels: 2
  duration_padding_sec: 2.0
  overwrite: true
  resume: false
  max_workers: 1
  log_level: INFO

io:
  midi_dir: ./corpus/midi
  output_dir: ./corpus/audio/pedalboard_all_effects
  output_format: wav
  mp3_bitrate_kbps: 192
  file_naming: "{stem}"

dawdreamer:
  enabled: true
  block_size: 512
  plugin_path: null
  preset_path: null
  soundfont_path: /usr/share/sounds/sf2/default-GM.sf2
  bpm: 120
  faust_code: null
  clear_midi_between_renders: true

pedalboard:
  enabled: true
  instrument:
    plugin_path: null
    preset_path: null
    reload_plugin_per_file: false
    silence_flush_sec: 0.5
  effects:
    - type: Compressor
      threshold_db: -18.0
      ratio: 4.0
      attack_ms: 5.0
      release_ms: 100.0
      enabled: true
    - type: Reverb
      room_size: 0.4
      damping: 0.5
      wet_level: 0.15
      dry_level: 0.85
      width: 1.0
      freeze_mode: false
      enabled: true
    - type: Limiter
      threshold_db: -1.0
      release_ms: 100.0
      enabled: true
    - type: Chorus
      rate_hz: 1.0
      depth: 0.25
      centre_delay_ms: 7.0
      feedback: 0.0
      mix: 0.5
      enabled: true
    - type: Delay
      delay_seconds: 0.5
      feedback: 0.0
      mix: 0.5
      enabled: true
    - type: Distortion
      drive_db: 25.0
      enabled: true
    - type: Gain
      gain_db: 0.0
      enabled: true

normalisation:
  enabled: true
  mode: peak
  target_db: -1.0
  pre_effects: false

quality_gates:
  silence_threshold_rms: 0.001
  min_duration_sec: 0.1
  max_duration_deviation_sec: 1.0
  clip_threshold: 1.0

observability:
  write_manifest: true
  manifest_path: ./corpus/audio/pedalboard_all_effects/renders.jsonl
  write_failed_list: true
  emit_sse_events: false

separation:
  enabled: false
  backend: passthrough
  model: htdemucs
  device: cpu
  stem: null
  output_dir: stems

transcription:
  output_dir: transcriptions
  transcribers:
    - type: basic_pitch
      enabled: true
      onset_threshold: 0.5
      frame_threshold: 0.3
      minimum_note_length_ms: 127.7
      minimum_frequency_hz: null
      maximum_frequency_hz: null

evaluation:
  note_metrics:
    enabled: true
    onset_tolerance_sec: 0.05
    offset_ratio: 0.2
    offset_min_tolerance_sec: 0.05
    velocity_tolerance: 0.1
  frame_metrics:
    enabled: true
    hop_sec: 0.01
  expressive_metrics:
    enabled: true
    harmony_window_sec: 2.0
  dtw:
    enabled: false
    frame_size: 4096
    hop_size: 2048
    max_frames: 4000

benchmark:
  results_path: benchmark_results.jsonl
  include_baseline: true
  baseline_name: baseline
  conditions: []
  sweeps: []
