# Multi-worker parallel: render (pedalboard_instrument), transcribe, and evaluate.
# pipeline.max_workers: 4  -> ThreadPoolExecutor in run_pipeline (PEDALBOARD_INSTRUMENT path)
# transcription.max_workers: 2 -> ThreadPoolExecutor in sonitra transcribe
# evaluation.max_workers: 2   -> ThreadPoolExecutor in sonitra evaluate
# transcribers.device: cpu     -> tf.device("cpu") context in BasicPitchTranscriber
# quality_gates.silence_threshold_rms: 0.0 -> no silence gate (falls back to FluidSynth when no plugin)
render_pipeline:
    synth_backend: pedalboard_instrument
    effects_chain: pedalboard
    input_type: midi
    bpm: 120
    sample_rate: 44100
    bit_depth: 24
    channels: 2
    duration_padding_sec: 2.0
    overwrite: true
    resume: false
    max_workers: 4
    log_level: INFO

io:
    corpus_root: ./corpus
    output_format: wav
    mp3_bitrate_kbps: 192
    file_naming: "{stem}"
    dataset: test

fluidsynth:
    soundfont_path: /usr/share/sounds/sf2/default-GM.sf2

dawdreamer:
    block_size: 512
    plugin_path: null
    preset_path: null
    faust_code: null
    clear_midi_between_renders: true

pedalboard:
    instrument:
        plugin_path: null
        preset_path: null
        reload_plugin_per_file: false
        silence_flush_sec: 0.5
    effects:
        - type: Compressor
          threshold_db: -18.0
          ratio: 4.0
          attack_ms: 5.0
          release_ms: 100.0
          enabled: true
        - type: Reverb
          room_size: 0.4
          damping: 0.5
          wet_level: 0.15
          dry_level: 0.85
          width: 1.0
          freeze_mode: false
          enabled: true

normalisation:
    enabled: true
    mode: peak
    target_db: -1.0
    pre_effects: false

quality_gates:
    silence_threshold_rms: 0.0
    min_duration_sec: 0.0
    max_duration_deviation_sec: 1.0
    clip_threshold: 1.0

observability:
    write_manifest: true
    manifest_path: renders.jsonl
    write_failed_list: true
    emit_sse_events: false

separation:
    enabled: false
    backend: passthrough
    model: htdemucs
    device: gpu
    stem: null
    output_dir: stems

transcription:
    output_dir: transcriptions
    max_workers: 2
    transcribers:
        - type: basic_pitch
          enabled: true
          onset_threshold: 0.5
          frame_threshold: 0.3
          minimum_note_length_ms: 127.7
          minimum_frequency_hz: null
          maximum_frequency_hz: null
          device: cpu
          melodia_trick: true
          multiple_pitch_bends: false
          save_raw_outputs: true

evaluation:
    note_metrics:
        enabled: true
        onset_tolerance_sec: 0.05
        offset_ratio: 0.2
        offset_min_tolerance_sec: 0.05
        velocity_tolerance: 0.1
    frame_metrics:
        enabled: true
        hop_sec: 0.01
    expressive_metrics:
        enabled: true
        harmony_window_sec: 2.0
    dtw:
        enabled: false
        frame_size: 4096
        hop_size: 2048
        max_frames: 4000
    max_workers: 2

benchmark:
    results_path: benchmark_results.jsonl
    include_baseline: true
    baseline_name: baseline
    conditions: []
    sweeps: []
