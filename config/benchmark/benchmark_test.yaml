# Benchmark smoke-test: 4 conditions, designed to complete quickly on a small corpus.
# Conditions: baseline, no_reverb, wet_level=0.0, wet_level=0.6
#
# Usage:
#   sonitra benchmark --config config/benchmark/benchmark_test.yaml --dataset test --limit 2
pipeline:
  synth_backend: fluidsynth
  effects_chain: pedalboard
  bpm: 120
  sample_rate: 44100
  bit_depth: 24
  channels: 2
  duration_padding_sec: 2.0
  overwrite: true
  resume: false
  # Render parallelism. Only honoured when synth_backend is
  # pedalboard_instrument; fluidsynth and dawdreamer_* render serially
  # regardless (see pipeline.py), and dawdreamer is forced to 1 by
  # validate_worker_constraint() because JUCE is not concurrency-safe.
  max_workers: 8
  log_level: INFO

io:
  corpus_root: ./corpus
  output_format: wav
  mp3_bitrate_kbps: 192
  file_naming: "{stem}"
  dataset: null

dawdreamer:
  block_size: 512
  plugin_path: null
  preset_path: null
  faust_code: null
  clear_midi_between_renders: true

fluidsynth:
  soundfont_path: /usr/share/sounds/sf2/default-GM.sf2

pedalboard:
  instrument:
    plugin_path: null
    preset_path: null
    reload_plugin_per_file: false
    silence_flush_sec: 0.5
  effects:
    - type: Compressor
      threshold_db: -18.0
      ratio: 4.0
      attack_ms: 5.0
      release_ms: 100.0
      enabled: true
    - type: Reverb
      room_size: 0.4
      damping: 0.5
      wet_level: 0.15
      dry_level: 0.85
      width: 1.0
      freeze_mode: false
      enabled: true

normalisation:
  enabled: true
  mode: peak
  target_db: -1.0
  pre_effects: false

quality_gates:
  silence_threshold_rms: 0.001
  min_duration_sec: 0.1
  max_duration_deviation_sec: 1.0
  clip_threshold: 1.0

observability:
  write_manifest: true
  manifest_path: renders.jsonl
  write_failed_list: true
  emit_sse_events: false

separation:
  enabled: false
  backend: passthrough
  model: htdemucs
  device: cpu
  stem: null
  output_dir: stems

transcription:
  output_dir: transcriptions
  # Thread pool over audio files, sharing one TensorFlow process (and so one
  # GPU context) — safe to raise. Honoured by `sonitra transcribe`;
  # `sonitra benchmark` parallelises via benchmark.max_workers instead.
  max_workers: 1
  transcribers:
    - type: basic_pitch
      enabled: true
      # TensorFlow device string for inference. Requires the GPU image
      # (docker compose --profile gpu) or a bare-metal `[gpu]` install;
      # set to "cpu" to force CPU inference.
      device: GPU:0
      onset_threshold: 0.5
      frame_threshold: 0.3
      minimum_note_length_ms: 127.7
      minimum_frequency_hz: null
      maximum_frequency_hz: null
      melodia_trick: true
      multiple_pitch_bends: false
      save_raw_outputs: false

evaluation:
  note_metrics:
    enabled: true
    onset_tolerance_sec: 0.05
    offset_ratio: 0.2
    offset_min_tolerance_sec: 0.05
    velocity_tolerance: 0.1
  frame_metrics:
    enabled: true
    hop_sec: 0.01
  expressive_metrics:
    enabled: true
    harmony_window_sec: 2.0
  dtw:
    enabled: true
    frame_size: 4096
    hop_size: 2048
    max_frames: 4000
  # Thread pool over per-file metric computation (NumPy/SciPy, CPU-bound).
  # Honoured by `sonitra evaluate`.
  max_workers: 1

benchmark:
  results_path: benchmark_results.jsonl
  include_baseline: true
  baseline_name: baseline
  save_audio: false
  resume: true
  conditions:
    - name: no_reverb
      overrides:
        pedalboard.effects.1.enabled: false
  sweeps:
    - parameter: pedalboard.effects.1.wet_level
      values: [0.0, 0.6]
  # Process pool over conditions — the only knob that parallelises
  # `sonitra benchmark`. Kept at 1 because each worker is a separate process
  # with its own TensorFlow runtime, and TF pre-allocates almost all GPU
  # memory on init (~22 GB of 24 GB in the first process), so a second worker
  # is left with nothing. Raising this requires enabling GPU memory growth
  # first, or setting transcription device back to "cpu".
  max_workers: 2
