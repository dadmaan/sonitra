# TransKun segment-size and segment-hop sweep on the MAESTRO-v3 official test split, audio input.
# Each transcriber entry is one variant of the published default, changing only the setting under study.
# The run has the baseline condition only: transcriber settings are fixed when the model is built, so they cannot be condition overrides.
# Run: sonitra benchmark --config config/benchmark/paper_experiments/transcriber_params_transkun_maestro_test_audio.yaml
render_pipeline:
  synth_backend: fluidsynth
  effects_chain: pedalboard
  input_type: audio
  bpm: 120
  sample_rate: 44100
  bit_depth: 24
  channels: 2
  duration_padding_sec: 2.0
  overwrite: true
  resume: true
  max_workers: 8
  log_level: INFO

io:
  corpus_root: ./corpus
  output_format: wav
  mp3_bitrate_kbps: 192
  file_naming: "{stem}"
  dataset: maestro-v3
  metadata_csv: maestro-v3.0.0.csv
  join_column: midi_filename
  where:
    split: [test]

dawdreamer:
  block_size: 512
  plugin_path: null
  preset_path: null
  faust_code: null
  clear_midi_between_renders: true

fluidsynth:
  soundfont_path: /usr/share/sounds/sf2/default-GM.sf2

pedalboard:
  instrument:
    plugin_path: null
    preset_path: null
    reload_plugin_per_file: false
    silence_flush_sec: 0.5
  effects:
    # The tuning offset leads the chain: what is out of tune is the instrument
    # itself, so the shift belongs ahead of the amp, cabinet and room. Slot 1
    # exists only for the round-trip control, which shifts +c then -c to expose
    # the processing artifacts at the largest offset. Both slots ship disabled,
    # and a zero-cent slot is a passthrough, so a chain that declares either one
    # without switching it on leaves the signal unprocessed.
    - type: TuningOffset      # index 0 — the instrument's own tuning offset
      cents: 0.0
      high_quality: true
      transient_mode: crisp
      transient_detector: compound
      retain_phase_continuity: true
      use_long_fft_window: null
      use_time_domain_smoothing: false
      preserve_formants: true
      enabled: false
    - type: TuningOffset      # index 1 — return leg, used by the round trip only
      cents: 0.0
      high_quality: true
      transient_mode: crisp
      transient_detector: compound
      retain_phase_continuity: true
      use_long_fft_window: null
      use_time_domain_smoothing: false
      preserve_formants: true
      enabled: false
    - type: Reverb            # index 2
      room_size: 0.4
      damping: 0.5
      wet_level: 0.0
      dry_level: 1.0
      width: 1.0
      freeze_mode: false
      enabled: false
    - type: Chorus            # index 3
      rate_hz: 1.0
      depth: 0.25
      centre_delay_ms: 7.0
      feedback: 0.0
      mix: 0.5
      enabled: false
    - type: Distortion        # index 4
      drive_db: 25.0
      enabled: false

normalisation:
  enabled: true
  placement: both
  pre:
    mode: peak
    target_db: -1.0
  post:
    mode: rms
    target_db: -33.0
  peak_ceiling_db: -1.0

quality_gates:
  silence_threshold_rms: 0.001
  min_duration_sec: 0.1
  max_duration_deviation_sec: 1.0
  clip_threshold: 1.0

observability:
  write_manifest: true
  manifest_path: renders.jsonl
  write_failed_list: true
  emit_sse_events: false

separation:
  enabled: false
  backend: passthrough
  model: htdemucs
  device: cpu
  stem: null
  output_dir: stems

transcription:
  output_dir: transcriptions
  numeric_mode: strict
  gpu_memory_growth: true
  transcribers:
    # The default leaves both segment values null, so the bundled conf supplies 16 s at 50% overlap.
    - type: transkun
      name: tk_default
      enabled: true
      device: cuda
      segment_size_sec: null
      segment_hop_sec: null
      weights_path: null
      conf_path: null
    # segment size, published 16 s at 50% overlap, i.e. hop 8 s (TransKun, ISMIR 2024, arXiv 2404.09466)
    - type: transkun
      name: tk_seg=8s
      enabled: true
      device: cuda
      segment_size_sec: 8.0
      segment_hop_sec: 4.0
      weights_path: null
      conf_path: null
    - type: transkun
      name: tk_seg=12s
      enabled: true
      device: cuda
      segment_size_sec: 12.0
      segment_hop_sec: 6.0
      weights_path: null
      conf_path: null
    - type: transkun
      name: tk_seg=24s
      enabled: true
      device: cuda
      segment_size_sec: 24.0
      segment_hop_sec: 12.0
      weights_path: null
      conf_path: null
    - type: transkun
      name: tk_seg=32s
      enabled: true
      device: cuda
      segment_size_sec: 32.0
      segment_hop_sec: 16.0
      weights_path: null
      conf_path: null
    # segment hop at the published 16 s size: 4 s is 75% overlap, 12 s is 25%, 16 s is none
    - type: transkun
      name: tk_hop=4s
      enabled: true
      device: cuda
      segment_size_sec: 16.0
      segment_hop_sec: 4.0
      weights_path: null
      conf_path: null
    - type: transkun
      name: tk_hop=12s
      enabled: true
      device: cuda
      segment_size_sec: 16.0
      segment_hop_sec: 12.0
      weights_path: null
      conf_path: null
    - type: transkun
      name: tk_hop=16s
      enabled: true
      device: cuda
      segment_size_sec: 16.0
      segment_hop_sec: 16.0
      weights_path: null
      conf_path: null

evaluation:
  note_metrics:
    enabled: true
    onset_tolerance_sec: 0.05
    offset_ratio: 0.2
    offset_min_tolerance_sec: 0.05
    velocity_tolerance: 0.1
  frame_metrics:
    enabled: true
    hop_sec: 0.01
  expressive_metrics:
    enabled: true
    harmony_window_sec: 2.0
  dtw:
    enabled: false
    frame_size: 4096
    hop_size: 2048
    max_frames: 4000

benchmark:
  results_path: benchmark_results.jsonl
  include_baseline: true
  baseline_name: baseline
  save_audio: false
  resume: true
  conditions: []
  sweeps: []
  max_workers: 1
