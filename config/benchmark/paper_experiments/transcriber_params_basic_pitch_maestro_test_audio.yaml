# Basic Pitch parameter sweep on the MAESTRO-v3 official test split, audio input.
# Each transcriber entry is one variant of the published default, changing only the setting under study.
# The run has the baseline condition only: transcriber settings are fixed when the model is built, so they cannot be condition overrides.
# Run: sonitra benchmark --config config/benchmark/paper_experiments/transcriber_params_basic_pitch_maestro_test_audio.yaml
render_pipeline:
  synth_backend: fluidsynth
  effects_chain: pedalboard
  input_type: audio
  bpm: 120
  sample_rate: 44100
  bit_depth: 24
  channels: 2
  duration_padding_sec: 2.0
  overwrite: true
  resume: true
  max_workers: 8
  log_level: INFO

io:
  corpus_root: ./corpus
  output_format: wav
  mp3_bitrate_kbps: 192
  file_naming: "{stem}"
  dataset: maestro-v3
  metadata_csv: maestro-v3.0.0.csv
  join_column: midi_filename
  where:
    split: [test]

dawdreamer:
  block_size: 512
  plugin_path: null
  preset_path: null
  faust_code: null
  clear_midi_between_renders: true

fluidsynth:
  soundfont_path: /usr/share/sounds/sf2/default-GM.sf2

pedalboard:
  instrument:
    plugin_path: null
    preset_path: null
    reload_plugin_per_file: false
    silence_flush_sec: 0.5
  effects:
    # The tuning offset leads the chain: what is out of tune is the instrument
    # itself, so the shift belongs ahead of the amp, cabinet and room. Slot 1
    # exists only for the round-trip control, which shifts +c then -c to expose
    # the processing artifacts at the largest offset. Both slots ship disabled,
    # and a zero-cent slot is a passthrough, so a chain that declares either one
    # without switching it on leaves the signal unprocessed.
    - type: TuningOffset      # index 0 — the instrument's own tuning offset
      cents: 0.0
      high_quality: true
      transient_mode: crisp
      transient_detector: compound
      retain_phase_continuity: true
      use_long_fft_window: null
      use_time_domain_smoothing: false
      preserve_formants: true
      enabled: false
    - type: TuningOffset      # index 1 — return leg, used by the round trip only
      cents: 0.0
      high_quality: true
      transient_mode: crisp
      transient_detector: compound
      retain_phase_continuity: true
      use_long_fft_window: null
      use_time_domain_smoothing: false
      preserve_formants: true
      enabled: false
    - type: Reverb            # index 2
      room_size: 0.4
      damping: 0.5
      wet_level: 0.0
      dry_level: 1.0
      width: 1.0
      freeze_mode: false
      enabled: false
    - type: Chorus            # index 3
      rate_hz: 1.0
      depth: 0.25
      centre_delay_ms: 7.0
      feedback: 0.0
      mix: 0.5
      enabled: false
    - type: Distortion        # index 4
      drive_db: 25.0
      enabled: false

normalisation:
  enabled: true
  placement: both
  pre:
    mode: peak
    target_db: -1.0
  post:
    mode: rms
    target_db: -33.0
  peak_ceiling_db: -1.0

quality_gates:
  silence_threshold_rms: 0.001
  min_duration_sec: 0.1
  max_duration_deviation_sec: 1.0
  clip_threshold: 1.0

observability:
  write_manifest: true
  manifest_path: renders.jsonl
  write_failed_list: true
  emit_sse_events: false

separation:
  enabled: false
  backend: passthrough
  model: htdemucs
  device: cpu
  stem: null
  output_dir: stems

transcription:
  output_dir: transcriptions
  numeric_mode: strict
  gpu_memory_growth: true
  transcribers:
    - type: basic_pitch
      name: bp_default
      enabled: true
      device: cpu
      onset_threshold: 0.5
      frame_threshold: 0.3
      minimum_note_length_ms: 127.7
      minimum_frequency_hz: null
      maximum_frequency_hz: null
      melodia_trick: true
      multiple_pitch_bends: false
      save_raw_outputs: false
      batch_size: 16
    # onset threshold, published 0.5 (Bittner et al., ICASSP 2022)
    - type: basic_pitch
      name: bp_onset=0.3
      enabled: true
      device: cpu
      onset_threshold: 0.3
      frame_threshold: 0.3
      minimum_note_length_ms: 127.7
      minimum_frequency_hz: null
      maximum_frequency_hz: null
      melodia_trick: true
      multiple_pitch_bends: false
      save_raw_outputs: false
      batch_size: 16
    - type: basic_pitch
      name: bp_onset=0.4
      enabled: true
      device: cpu
      onset_threshold: 0.4
      frame_threshold: 0.3
      minimum_note_length_ms: 127.7
      minimum_frequency_hz: null
      maximum_frequency_hz: null
      melodia_trick: true
      multiple_pitch_bends: false
      save_raw_outputs: false
      batch_size: 16
    - type: basic_pitch
      name: bp_onset=0.6
      enabled: true
      device: cpu
      onset_threshold: 0.6
      frame_threshold: 0.3
      minimum_note_length_ms: 127.7
      minimum_frequency_hz: null
      maximum_frequency_hz: null
      melodia_trick: true
      multiple_pitch_bends: false
      save_raw_outputs: false
      batch_size: 16
    - type: basic_pitch
      name: bp_onset=0.7
      enabled: true
      device: cpu
      onset_threshold: 0.7
      frame_threshold: 0.3
      minimum_note_length_ms: 127.7
      minimum_frequency_hz: null
      maximum_frequency_hz: null
      melodia_trick: true
      multiple_pitch_bends: false
      save_raw_outputs: false
      batch_size: 16
    # frame threshold, published 0.3, the released value tuned on validation (Bittner et al., ICASSP 2022)
    - type: basic_pitch
      name: bp_frame=0.1
      enabled: true
      device: cpu
      onset_threshold: 0.5
      frame_threshold: 0.1
      minimum_note_length_ms: 127.7
      minimum_frequency_hz: null
      maximum_frequency_hz: null
      melodia_trick: true
      multiple_pitch_bends: false
      save_raw_outputs: false
      batch_size: 16
    - type: basic_pitch
      name: bp_frame=0.2
      enabled: true
      device: cpu
      onset_threshold: 0.5
      frame_threshold: 0.2
      minimum_note_length_ms: 127.7
      minimum_frequency_hz: null
      maximum_frequency_hz: null
      melodia_trick: true
      multiple_pitch_bends: false
      save_raw_outputs: false
      batch_size: 16
    - type: basic_pitch
      name: bp_frame=0.4
      enabled: true
      device: cpu
      onset_threshold: 0.5
      frame_threshold: 0.4
      minimum_note_length_ms: 127.7
      minimum_frequency_hz: null
      maximum_frequency_hz: null
      melodia_trick: true
      multiple_pitch_bends: false
      save_raw_outputs: false
      batch_size: 16
    - type: basic_pitch
      name: bp_frame=0.5
      enabled: true
      device: cpu
      onset_threshold: 0.5
      frame_threshold: 0.5
      minimum_note_length_ms: 127.7
      minimum_frequency_hz: null
      maximum_frequency_hz: null
      melodia_trick: true
      multiple_pitch_bends: false
      save_raw_outputs: false
      batch_size: 16
    # minimum note length, published 127.7 ms, the paper's roughly 120 ms floor (Bittner et al., ICASSP 2022)
    - type: basic_pitch
      name: bp_minlen=58ms
      enabled: true
      device: cpu
      onset_threshold: 0.5
      frame_threshold: 0.3
      minimum_note_length_ms: 58.0
      minimum_frequency_hz: null
      maximum_frequency_hz: null
      melodia_trick: true
      multiple_pitch_bends: false
      save_raw_outputs: false
      batch_size: 16
    - type: basic_pitch
      name: bp_minlen=197ms
      enabled: true
      device: cpu
      onset_threshold: 0.5
      frame_threshold: 0.3
      minimum_note_length_ms: 197.4
      minimum_frequency_hz: null
      maximum_frequency_hz: null
      melodia_trick: true
      multiple_pitch_bends: false
      save_raw_outputs: false
      batch_size: 16
    # melodia trick, published on, a release-time post-processing step not in the paper
    - type: basic_pitch
      name: bp_melodia=off
      enabled: true
      device: cpu
      onset_threshold: 0.5
      frame_threshold: 0.3
      minimum_note_length_ms: 127.7
      minimum_frequency_hz: null
      maximum_frequency_hz: null
      melodia_trick: false
      multiple_pitch_bends: false
      save_raw_outputs: false
      batch_size: 16

evaluation:
  note_metrics:
    enabled: true
    onset_tolerance_sec: 0.05
    offset_ratio: 0.2
    offset_min_tolerance_sec: 0.05
    velocity_tolerance: 0.1
  frame_metrics:
    enabled: true
    hop_sec: 0.01
  expressive_metrics:
    enabled: true
    harmony_window_sec: 2.0
  dtw:
    enabled: false
    frame_size: 4096
    hop_size: 2048
    max_frames: 4000

benchmark:
  results_path: benchmark_results.jsonl
  include_baseline: true
  baseline_name: baseline
  save_audio: false
  resume: true
  conditions: []
  sweeps: []
  max_workers: 1
