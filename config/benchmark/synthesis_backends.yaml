# Synthesis backends: test whether AMT rankings are stable across synthesis engines.
# Base pipeline: dawdreamer_faust with effects_chain: none (normalisation only).
# Effects chain is disabled to isolate the backend variable.
#
# Conditions (3 named, no sweeps, no baseline):
#   fluidsynth      — standard GM SoundFont rendering
#   dawdreamer_faust — Faust oscillator via DawDreamer
#   dawdreamer_vital — Vital VST3 via DawDreamer (fails gracefully if plugin absent)
#
# WARNING: dawdreamer_vital requires Vital to be installed at the configured path.
# The benchmark runner logs per-file failures and continues, so the other backends
# still produce results when Vital is unavailable.
#
# Usage:
#   sonitra benchmark --config config/benchmark/synthesis_backends.yaml --dataset <name>
pipeline:
  synth_backend: dawdreamer_faust
  effects_chain: none
  bpm: 120
  sample_rate: 44100
  bit_depth: 24
  channels: 2
  duration_padding_sec: 2.0
  overwrite: true
  resume: false
  max_workers: 1
  log_level: INFO

io:
  corpus_root: ./corpus
  output_format: wav
  mp3_bitrate_kbps: 192
  file_naming: "{stem}"
  dataset: null

dawdreamer:
  block_size: 512
  plugin_path: null
  preset_path: null
  faust_code: null
  clear_midi_between_renders: true

fluidsynth:
  soundfont_path: /usr/share/sounds/sf2/default-GM.sf2

pedalboard:
  instrument:
    plugin_path: null
    preset_path: null
    reload_plugin_per_file: false
    silence_flush_sec: 0.5
  effects: []

normalisation:
  enabled: true
  mode: peak
  target_db: -1.0
  pre_effects: false

quality_gates:
  silence_threshold_rms: 0.001
  min_duration_sec: 0.1
  max_duration_deviation_sec: 1.0
  clip_threshold: 1.0

observability:
  write_manifest: true
  manifest_path: renders.jsonl
  write_failed_list: true
  emit_sse_events: false

separation:
  enabled: false
  backend: passthrough
  model: htdemucs
  device: cpu
  stem: null
  output_dir: stems

transcription:
  output_dir: transcriptions
  max_workers: 6
  transcribers:
    - type: basic_pitch
      enabled: true
      device: GPU:0
      onset_threshold: 0.5
      frame_threshold: 0.3
      minimum_note_length_ms: 127.7
      minimum_frequency_hz: null
      maximum_frequency_hz: null
      melodia_trick: true
      multiple_pitch_bends: false
      save_raw_outputs: false

evaluation:
  note_metrics:
    enabled: true
    onset_tolerance_sec: 0.05
    offset_ratio: 0.2
    offset_min_tolerance_sec: 0.05
    velocity_tolerance: 0.1
  frame_metrics:
    enabled: true
    hop_sec: 0.01
  expressive_metrics:
    enabled: true
    harmony_window_sec: 2.0
  dtw:
    enabled: false
    frame_size: 4096
    hop_size: 2048
    max_frames: 4000
  max_workers: 4

benchmark:
  results_path: benchmark_results.jsonl
  include_baseline: false
  baseline_name: fluidsynth
  save_audio: false
  resume: false
  conditions:
    - name: fluidsynth
      overrides:
        pipeline.synth_backend: fluidsynth
    - name: dawdreamer_faust
      overrides:
        pipeline.synth_backend: dawdreamer_faust
        'dawdreamer.faust_code': 'import("stdfaust.lib"); process = os.sawtooth(hslider("freq[midi:freq]",440,50,2000,1)) * hslider("gain[midi:gain]",0.5,0,1,0.01) * button("gate[midi:gate]");'
    - name: dawdreamer_vital
      overrides:
        pipeline.synth_backend: dawdreamer_vst
        dawdreamer.plugin_path: plugin/vital/lib/vst3/Vital.vst3
        dawdreamer.preset_path: null
  sweeps: []
  max_workers: 1
