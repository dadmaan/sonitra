# Numerics check: does `transcription.numeric_mode` change results, and by how much?
#
# This measures the APPARATUS, not the models. It establishes Sonitra's
# measurement error bars (determinism + TF32 precision), so its output is a
# methods artifact and must not land in the same table as model scores.
#
# A transcription-only sweep re-renders identical audio per condition, which
# is pure waste; for routine use prefer the equivalence harness and keep this
# preset for the occasional published methods run.
#
# NOTE: `transcription.numeric_mode` + `gpu_memory_growth` are process-global:
# runner builds transcribers once from base config (runner.py:271,506), so
# per-condition overrides are recorded in BenchmarkRecord.overrides but NOT
# applied — one file with warn/strict conditions would falsely show ~0 delta.
# Run once per mode with top-level `transcription.numeric_mode: "off"/warn/strict`
# (3 separate runs). Keep "off" quoted (YAML 1.1 bool trap).
#
# Usage:
#   sonitra benchmark --config config/benchmark/numerics_check.yaml --dataset test --limit 2 --seed 123
#   # then repeat with numeric_mode: warn / strict edited at top level
render_pipeline:
  synth_backend: fluidsynth
  effects_chain: pedalboard
  input_type: midi
  bpm: 120
  sample_rate: 44100
  bit_depth: 24
  channels: 2
  duration_padding_sec: 2.0
  overwrite: true
  resume: false
  max_workers: 1
  log_level: INFO

io:
  corpus_root: ./corpus
  output_format: wav
  mp3_bitrate_kbps: 192
  file_naming: "{stem}"
  dataset: null

dawdreamer:
  block_size: 512
  plugin_path: null
  preset_path: null
  faust_code: null
  clear_midi_between_renders: true

fluidsynth:
  soundfont_path: /usr/share/sounds/sf2/default-GM.sf2

pedalboard:
  instrument:
    plugin_path: null
    preset_path: null
    reload_plugin_per_file: false
    silence_flush_sec: 0.5
  effects:
    - type: Compressor
      threshold_db: -18.0
      ratio: 4.0
      attack_ms: 5.0
      release_ms: 100.0
      enabled: true
    - type: Reverb
      room_size: 0.4
      damping: 0.5
      wet_level: 0.15
      dry_level: 0.85
      width: 1.0
      freeze_mode: false
      enabled: true

normalisation:
  enabled: true
  mode: peak
  target_db: -1.0
  pre_effects: false

quality_gates:
  silence_threshold_rms: 0.001
  min_duration_sec: 0.1
  max_duration_deviation_sec: 1.0
  clip_threshold: 1.0

observability:
  write_manifest: true
  manifest_path: renders.jsonl
  write_failed_list: true
  emit_sse_events: false

separation:
  enabled: false
  backend: passthrough
  model: htdemucs
  device: cpu
  stem: null
  output_dir: stems

transcription:
  output_dir: transcriptions
  max_workers: 1
  numeric_mode: "off" # baseline; rerun with warn/strict at top level (see header)
  gpu_memory_growth: false
  transcribers:
    - type: basic_pitch
      enabled: true
      device: cpu
      onset_threshold: 0.5
      frame_threshold: 0.3
      minimum_note_length_ms: 127.7
      minimum_frequency_hz: null
      maximum_frequency_hz: null
      melodia_trick: true
      multiple_pitch_bends: false
      save_raw_outputs: false
    - type: transkun
      enabled: true
      device: cpu
      segment_size_sec: null
      segment_hop_sec: null
      weights_path: null
      conf_path: null

evaluation:
  note_metrics:
    enabled: true
    onset_tolerance_sec: 0.05
    offset_ratio: 0.2
    offset_min_tolerance_sec: 0.05
    velocity_tolerance: 0.1
  frame_metrics:
    enabled: true
    hop_sec: 0.01
  expressive_metrics:
    enabled: true
    harmony_window_sec: 2.0
  dtw:
    enabled: false
    frame_size: 4096
    hop_size: 2048
    max_frames: 4000
  max_workers: 1

benchmark:
  results_path: benchmark_results.jsonl
  include_baseline: true
  baseline_name: baseline
  save_audio: false
  resume: false
  conditions: []
  sweeps: []
  max_workers: 1
